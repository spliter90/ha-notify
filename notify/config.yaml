name: Notify
version: "1.2.0"
slug: notify
description: Nimmt Ereignisse entgegen, ordnet sie Kategorien zu, überwacht Webdienste und lässt sie sehen und quittieren – im Dashboard, in einer Weboberfläche und am Handy
url: https://github.com/spliter90/ha-notify
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:bell-ring-outline
panel_title: Notify
ports:
  8099/tcp: null
ports_description:
  8099/tcp: REST-API für Geräte außerhalb von Home Assistant (nur mit api_token)
options:
  retention_days: 90
  max_events: 5000
  api_token: ""
  default_category: ""
  categories:
    - name: intern
      label: Intern
      icon: mdi:home-outline
      color: "#2f6fed"
    - name: extern
      label: Extern
      icon: mdi:earth
      color: "#8a5cf6"
    - name: web
      label: Web-Störungen
      icon: mdi:web-off
      color: "#e0423a"
    - name: haushalt
      label: Haushalt
      icon: mdi:washing-machine
      color: "#1f9d55"
    - name: system
      label: System
      icon: mdi:server
      color: "#6b7280"
  monitors: []
  event_type: notify_event
  ack_event_type: notify_ack
  seen_event_type: notify_seen
  ack_min_level: warning
  mobile_actions: true
  fire_events: true
  sensor_events: 10
  forward_service: ""
  forward_min_level: error
  log_level: info
schema:
  retention_days: int(1,3650)
  max_events: int(100,1000000)
  api_token: str?
  default_category: str?
  categories:
    - name: str
      label: str?
      icon: str?
      color: str?
      forward_service: str?
      forward_min_level: list(debug|info|success|warning|error|critical)?
  monitors:
    - name: str
      url: str
      category: str?
      interval: int(30,86400)?
      timeout: int(1,120)?
      failures: int(1,20)?
      keyword: str?
      expect_status: int(100,599)?
      level: list(debug|info|success|warning|error|critical)?
      verify_ssl: bool?
  event_type: str
  ack_event_type: str
  seen_event_type: str
  ack_min_level: list(debug|info|success|warning|error|critical)
  mobile_actions: bool
  fire_events: bool
  sensor_events: int(0,25)
  forward_service: str?
  forward_min_level: list(debug|info|success|warning|error|critical)
  log_level: list(debug|info|warning|error)
